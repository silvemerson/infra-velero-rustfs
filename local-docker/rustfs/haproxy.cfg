global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option redispatch
    retries 2
    timeout connect 5s
    # Generous timeouts: backup uploads/downloads can be long-lived.
    timeout client 5m
    timeout server 5m
    # init-addr none + resolvers: HAProxy still starts when a node is down
    # (its name doesn't resolve in Docker DNS) and picks up the node's IP once
    # it comes back.
    default-server init-addr last,libc,none resolvers docker check inter 2s fall 2 rise 2

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

# S3 API — the single endpoint clients (Velero, aws CLI) should use.
frontend s3
    bind :9000
    default_backend rustfs_s3

backend rustfs_s3
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    server node0 node0:9000
    server node1 node1:9000
    server node2 node2:9000
    server node3 node3:9000

# Web console. Health is checked against the node's S3 port.
frontend console
    bind :9001
    default_backend rustfs_console

backend rustfs_console
    balance source
    option httpchk GET /health
    http-check expect status 200
    server node0 node0:9001 port 9000
    server node1 node1:9001 port 9000
    server node2 node2:9001 port 9000
    server node3 node3:9001 port 9000

# Stats page: shows which nodes are UP/DOWN during the failover demo.
frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
