x-rustfs-common: &rustfs-common
  image: rustfs/rustfs:latest
  # Named Docker volumes are created root-owned (0755); the image's default
  # "rustfs" user (uid 10001) can't write into them. Running as root sidesteps
  # that for this local lab — not something to carry into a real deployment.
  user: "0:0"
  environment:
    RUSTFS_VOLUMES: "http://node{0...3}:9000/data/rustfs{0...3}"
    RUSTFS_ADDRESS: "0.0.0.0:9000"
    RUSTFS_CONSOLE_ENABLE: "true"
    RUSTFS_ACCESS_KEY: rustfsadmin
    RUSTFS_SECRET_KEY: rustfsadmin
    RUSTFS_RPC_SECRET: rustfs-lab-internode-rpc-secret
    # Local single-host lab only: all "disks" share the same underlying
    # Docker storage device, which RustFS rejects by default in distributed
    # mode. Do not use this flag outside of local testing/CI.
    RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
  networks:
    - rustfs-net

services:
  # Single entry point in front of the 4 nodes, like the load balancer/VIP a
  # real deployment would have. Clients (Velero, aws CLI, browser) talk to
  # this, so any node — including node0 — can go down without breaking them.
  # Each node's S3 API is still published directly on 9010-9013 for debugging.
  lb:
    image: haproxy:3.0-alpine
    container_name: rustfs-lb
    hostname: rustfs-lb
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9090:9001"   # web console
      - "8404:8404"   # HAProxy stats
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - rustfs-net

  node0:
    <<: *rustfs-common
    container_name: rustfs-node0
    hostname: node0
    ports:
      - "9010:9000"
    volumes:
      - rustfs-node0-disk0:/data/rustfs0
      - rustfs-node0-disk1:/data/rustfs1
      - rustfs-node0-disk2:/data/rustfs2
      - rustfs-node0-disk3:/data/rustfs3

  node1:
    <<: *rustfs-common
    container_name: rustfs-node1
    hostname: node1
    ports:
      - "9011:9000"
    volumes:
      - rustfs-node1-disk0:/data/rustfs0
      - rustfs-node1-disk1:/data/rustfs1
      - rustfs-node1-disk2:/data/rustfs2
      - rustfs-node1-disk3:/data/rustfs3

  node2:
    <<: *rustfs-common
    container_name: rustfs-node2
    hostname: node2
    ports:
      - "9012:9000"
    volumes:
      - rustfs-node2-disk0:/data/rustfs0
      - rustfs-node2-disk1:/data/rustfs1
      - rustfs-node2-disk2:/data/rustfs2
      - rustfs-node2-disk3:/data/rustfs3

  node3:
    <<: *rustfs-common
    container_name: rustfs-node3
    hostname: node3
    ports:
      - "9013:9000"
    volumes:
      - rustfs-node3-disk0:/data/rustfs0
      - rustfs-node3-disk1:/data/rustfs1
      - rustfs-node3-disk2:/data/rustfs2
      - rustfs-node3-disk3:/data/rustfs3

networks:
  rustfs-net:
    driver: bridge
    name: rustfs-ha-net

volumes:
  rustfs-node0-disk0:
  rustfs-node0-disk1:
  rustfs-node0-disk2:
  rustfs-node0-disk3:
  rustfs-node1-disk0:
  rustfs-node1-disk1:
  rustfs-node1-disk2:
  rustfs-node1-disk3:
  rustfs-node2-disk0:
  rustfs-node2-disk1:
  rustfs-node2-disk2:
  rustfs-node2-disk3:
  rustfs-node3-disk0:
  rustfs-node3-disk1:
  rustfs-node3-disk2:
  rustfs-node3-disk3:
